# Generated by create-line-harness. Safe to overwrite on future setup runs.
name = "field-audition"
main = "src/index.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true
account_id = "a0620fd6ed250ac6c79f5ab3c86836cd"

# Worker runs before static assets so bot UAs get OGP HTML injection;
# normal UAs fall through to the SPA via env.ASSETS.fetch().
[assets]
directory = "dist/client"
binding = "ASSETS"
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "field-audition"
